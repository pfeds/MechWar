<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MechWar</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MechWar.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.mechWarAudio = (() => {
            let audioContext;

            function getContext() {
                audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === "suspended") {
                    audioContext.resume();
                }

                return audioContext;
            }

            function tone(context, frequency, type, start, duration, volume, rampTo = 0.0001) {
                const oscillator = context.createOscillator();
                const gain = context.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, start);
                gain.gain.setValueAtTime(volume, start);
                gain.gain.exponentialRampToValueAtTime(rampTo, start + duration);

                oscillator.connect(gain);
                gain.connect(context.destination);

                oscillator.start(start);
                oscillator.stop(start + duration);
            }

            function playFire() {
                const context = getContext();
                const start = context.currentTime;
                tone(context, 1320, "square", start, 0.06, 0.06);
                tone(context, 1180, "square", start + 0.07, 0.06, 0.05);
                tone(context, 990, "square", start + 0.14, 0.07, 0.045);
            }

            function playHit() {
                const context = getContext();
                const start = context.currentTime;
                tone(context, 180, "sawtooth", start, 0.12, 0.08);
                tone(context, 110, "triangle", start + 0.03, 0.18, 0.07);
            }

            return {
                play(soundName) {
                    if (soundName === "fire") {
                        playFire();
                        return;
                    }

                    if (soundName === "hit") {
                        playHit();
                    }
                }
            };
        })();

        window.mechWarUi = {
            scrollElementToBottom(element) {
                if (!element) {
                    return;
                }

                element.scrollTop = element.scrollHeight;
            },

            scrollElementToBottomIfNearBottom(element, thresholdPx) {
                if (!element) {
                    return;
                }

                const threshold = Number.isFinite(thresholdPx) ? thresholdPx : 48;
                const distanceFromBottom = element.scrollHeight - (element.scrollTop + element.clientHeight);
                if (distanceFromBottom <= threshold) {
                    element.scrollTop = element.scrollHeight;
                }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
